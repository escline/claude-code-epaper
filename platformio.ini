; Waveshare 4.2" e-Paper Module (rev2.1, 400x300 B/W) on an ESP32-S3-N16R8
; https://docs.platformio.org/page/projectconf.html
;
; Two environments, one per panel controller. Start with uc8176; if the test
; pattern is blank/ghosted/scrambled, switch to ssd1683. Pick the active one
; from the PlatformIO env selector in the VSCode status bar, or build with
;   pio run -e ssd1683 -t upload

[platformio]
default_envs = uc8176

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- ESP32-S3-N16R8: 16 MB quad flash + 8 MB *octal* PSRAM ---
; memory_type must be qio_opi, or the board boot-loops.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags = -DBOARD_HAS_PSRAM

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps = zinggjm/GxEPD2@^1.6.9

; Older 4.2" B/W panels: GDEW042T2, UC8176 (IL0398)
[env:uc8176]
build_flags = ${env.build_flags} -DEPD_PANEL_UC8176

; Newer "V2" 4.2" B/W panels: GDEY042T81, SSD1683
[env:ssd1683]
build_flags = ${env.build_flags} -DEPD_PANEL_SSD1683
