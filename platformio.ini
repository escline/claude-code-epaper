; Claude Code status display on a Waveshare 4.2" e-Paper Module (rev2.1,
; 400x300 B/W) driven by an ESP32-S3-N16R8.
; https://docs.platformio.org/page/projectconf.html
;
; Panel controller (UC8176 vs SSD1683) is selected in include/config.h.
; Pins and layout live there too.

[platformio]
default_envs = monitor

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- ESP32-S3-N16R8: 16 MB quad flash + 8 MB *octal* PSRAM ---
; memory_type must be qio_opi, or the board boot-loops before setup() runs.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags = -DBOARD_HAS_PSRAM

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
	zinggjm/GxEPD2@^1.6.9
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.2.0

; The application: WiFi + MQTT + status rendering.
[env:monitor]
build_src_filter = +<*> -<paneltest.cpp>

; Standalone panel bring-up test. No WiFi, no secrets.h needed.
[env:paneltest]
build_src_filter = +<paneltest.cpp>
